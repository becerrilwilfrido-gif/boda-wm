<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acomodo de Mesas · Boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Pinyon+Script&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
[hidden]{display:none!important}
:root{
  --bg:#f8f4ee; --panel:#fffdf9; --ink:#2d2620; --muted:#8a7f74; --line:#e6ddd1;
  --gold:#b8913f; --gold-soft:#f3e8cf;
  --novia:#cf6f88; --novia-soft:#f9e3e9;
  --novio:#4d78a8; --novio-soft:#e1ebf6;
  --novios:#b8913f; --novios-soft:#f3e8cf;
  --otro:#7d8a6a; --otro-soft:#e8ecdf;
  --table:#fff; --floor:#f1ebe2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap;position:relative;z-index:45}
header h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:22px;margin:0;letter-spacing:.5px;white-space:nowrap}
header button{font-size:12.5px;padding:5px 10px}
header .tabs button{padding:5px 11px}
header .stats{font-size:12px;gap:10px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;min-width:0}
.more{position:relative;flex-shrink:0}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column;min-width:210px;z-index:50}
.menu[hidden]{display:none}
.menu button{border:none;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--gold-soft);color:var(--ink)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
header h1 span{color:var(--gold)}
.stats{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
.toolbar{margin-left:auto;display:flex;gap:6px;flex-wrap:nowrap;flex-shrink:0}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--gold);color:var(--gold)}
button.primary{background:var(--gold);border-color:var(--gold);color:#fff}
button.primary:hover{background:#a37f33;color:#fff}
button.danger:hover{border-color:#c0473f;color:#c0473f}
main{flex:1;display:flex;min-height:0}
aside{width:340px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.filters{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.filters input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
#guestList{overflow:auto;flex:1;padding:8px 10px 40px}
#guestList.dropping{background:#fbf3e6;outline:2px dashed var(--gold);outline-offset:-6px}
.fam{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;margin:8px 0;background:#fff}
.fam-h{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;cursor:grab}
.fam-h .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--cs);color:var(--c);font-weight:600}
.count{font-size:11px;color:var(--muted)}
.icon{border:none;background:none;padding:2px 4px;color:var(--muted);cursor:pointer;font-size:14px}
.icon:hover{color:var(--gold)}
.persons{display:flex;flex-wrap:wrap;gap:5px;padding:0 8px 8px 10px}
.p{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--cs);color:var(--ink);cursor:grab;border:1px solid transparent;display:flex;gap:5px;align-items:center;user-select:none}
.p.kid::before{content:"👶";font-size:11px}
.p.seated{background:#f4f1ec;color:var(--muted)}
.p .where{font-size:10px;background:#fff;border-radius:4px;padding:0 4px;color:var(--ink);border:1px solid var(--line)}
.p.sel,.fam.sel{outline:2px solid var(--gold);outline-offset:1px}
#listTabs{align-self:flex-start}
#listTabs button{padding:6px 14px;font-size:13px}
.az-letter{font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:700;color:var(--gold);margin:10px 4px 4px;border-bottom:1px solid var(--line)}
.p.az{display:flex;justify-content:space-between;margin:3px 0;padding:6px 10px;border-left:3px solid var(--c);font-size:13px}
.p.az .az-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p.az .az-none{font-size:11px;color:#b5533c;flex-shrink:0}
.fam.done{opacity:.55}
.c-Novia{--c:var(--novia);--cs:var(--novia-soft)}
.c-Novio{--c:var(--novio);--cs:var(--novio-soft)}
.c-Novios{--c:var(--novios);--cs:var(--novios-soft)}
.c-Otro{--c:var(--otro);--cs:var(--otro-soft)}

#planWrap{flex:1;overflow:auto;position:relative;padding:16px}
#stageBox{margin:0 auto;position:relative}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:#fbfaf7;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(80,60,30,.07);overflow:hidden}
.zone{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Cormorant Garamond",serif;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-size:17px;line-height:1.1}
.zone.vert{writing-mode:vertical-rl}
.zone.escenario{background:repeating-linear-gradient(45deg,#f6efe2,#f6efe2 10px,#f1e7d4 10px,#f1e7d4 20px);border:1px solid #e7d9bd;color:#9c7b3a;border-radius:8px;z-index:1}
.zone.pista{background:var(--floor);border:1px dashed #d8ccb9;border-radius:10px}
.zone.pista{flex-direction:column;gap:10px;font-size:14px}
.zone.pista img{width:82%;max-width:180px;opacity:.9}
.zone.salon{background:#fff;border:7px solid #3b342d;border-top:3px double #8f857a}
.zone.room{background:#eceae6;border:3px solid #3b342d;color:#7a736b;font-size:12px;letter-spacing:1px}
.zone.banos{background:#e6edf2;color:#5f7484}
.zone.barra{background:#d9cdb9;border:2px solid #3b342d;color:#5d5246;font-size:14px}
.zone.terraza{background:#eef2e8 radial-gradient(#d6dccb 1px,transparent 1.5px) 0 0/14px 14px;color:#7d8a6a}
.zone.asador{background:#efe6dc;border:6px solid #3b342d;color:#7a5f45;font-size:14px}
.zone.vestibulo{background:#fff;border:6px solid #3b342d;color:#5d5246;font-size:14px}
.zone.puerta{background:#fbfaf7;z-index:1}
.zone.entrada{color:var(--ink);font-size:24px;letter-spacing:4px}
.zone.entrada::before{content:"▲";font-size:14px;margin-right:8px}
.metro{position:absolute;font-size:12px;color:#9a9086;font-family:Inter,sans-serif}
.zoombar{position:sticky;top:0;z-index:5;display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.zoombar button{padding:4px 10px;background:rgba(255,255,255,.92)}
body.moving .ttop,body.moving [data-move]{cursor:move;outline:2px dashed var(--gold);outline-offset:3px}
body.moving .chair{pointer-events:none}
body.moving #stage{user-select:none;touch-action:none}
#bMove.on{background:var(--gold);color:#fff;border-color:var(--gold)}
#trash{position:fixed;right:24px;bottom:24px;z-index:35;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:120px;height:110px;border:2px dashed #c9a9a4;border-radius:16px;background:rgba(255,250,248,.95);color:#a2483d;font-size:12px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12);transition:transform .15s,background .15s}
#trash svg{width:38px;height:38px}
body.moving #trash,body.dragging-seat #trash{display:flex}
#trash.over{background:#f8dcd7;border-color:#c0473f;transform:scale(1.08)}
.ttop{position:absolute;background:var(--table);border:2px solid #d9cbb3;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.ttop:hover{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.ttop .tn{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:22px;line-height:1}
.ttop .tc{font-size:12px;color:var(--muted);margin-top:4px}
.ttop .bar{display:flex;gap:2px;margin-top:6px}
.ttop .bar i{width:8px;height:4px;border-radius:2px;background:#e8e0d4}
.ttop .bar i.Novia{background:var(--novia)}.ttop .bar i.Novio{background:var(--novio)}.ttop .bar i.Novios{background:var(--novios)}.ttop .bar i.Otro{background:var(--otro)}
.ttop.full{border-color:#a9c49a}
.ttop.honor{background:linear-gradient(#fffaf0,#fbf1dc);border-color:var(--gold)}
.ttop.drop,.chair.drop{border-color:var(--gold)!important;box-shadow:0 0 0 4px var(--gold-soft)}
.chair{position:absolute;height:26px;border-radius:6px;border:1.5px dashed #cfc3b0;background:#fcfaf6;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer;color:var(--muted);user-select:none}
.chair .num{font-size:10px;opacity:.7}
.chair.occ{border:1.5px solid var(--c);background:var(--cs);color:var(--ink);font-weight:500;cursor:grab}
.chair.occ span{overflow:hidden;text-overflow:ellipsis}
.chair .x{display:none;position:absolute;right:1px;top:1px;width:14px;height:14px;line-height:12px;text-align:center;border-radius:50%;background:#fff;color:#a33;font-size:11px;border:1px solid #e5c9c9}
.chair.occ:hover .x{display:block}
.chair.sel{outline:2px solid var(--gold);outline-offset:1px}
.chair.hl{box-shadow:0 0 0 3px #f5c542;}
.ttop.honor .tn{writing-mode:vertical-rl;transform:rotate(180deg);font-size:19px}
.honor-ctrl{position:absolute;display:flex;flex-direction:column;gap:4px}
.honor-ctrl button{padding:2px 8px;font-size:12px}

.legend{position:absolute;right:20px;bottom:18px;display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}

dialog{border:none;border-radius:14px;padding:0;width:min(460px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(40,30,20,.35)}
.dlg-h{padding:16px 20px 8px;font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600}
.dlg-b{padding:4px 20px 12px;max-height:60vh;overflow:auto}
.dlg-f{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.dlg-b label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.dlg-b input,.dlg-b select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seatrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0e9df}
.seatrow .n{width:22px;color:var(--muted);font-size:12px}
.seatrow .who{flex:1}
.seatrow .who small{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;margin-right:6px}

#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#printArea{display:none}

#bGuests,#scrim{display:none}
#selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:8px 8px 8px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;max-width:calc(100vw - 32px)}
#selbar.show{display:flex}
#selbar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#selbar button{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.chair.occ.sel .x{display:block}

/* Tablet (horizontal y vertical): la lista de invitados se abre como panel lateral */
@media (max-width:1180px){
  html,body{height:100dvh}
  header{padding:8px 12px;gap:10px;flex-wrap:nowrap}
  header h1{font-size:22px;white-space:nowrap}
  .stats{font-size:12px;gap:10px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
  .toolbar::-webkit-scrollbar{display:none}
  #bGuests{display:inline-block;background:var(--gold);border-color:var(--gold);color:#fff}
  main{position:relative}
  aside{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(380px,88vw);box-shadow:8px 0 30px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .25s ease}
  aside.open{transform:none}
  #scrim{position:fixed;inset:0;z-index:39;background:rgba(40,30,20,.3)}
  #scrim.show{display:block}
  #planWrap{padding:8px}
  .stats span:nth-child(n+3){display:none}
}
@media (max-width:700px){ .stats{display:none} }
/* Pantallas táctiles: botones y chips más fáciles de tocar */
@media (pointer:coarse){
  button,.btn{padding:9px 14px}
  .chip{padding:7px 12px;font-size:13px}
  .p{padding:7px 10px;font-size:13px}
  .fam-h{padding:10px}
  .icon{padding:6px 10px;font-size:16px}
  .chair .x{width:18px;height:18px;line-height:16px}
  .zoombar button{padding:8px 14px;font-size:15px}
}
/* ---------- Tarjetas de lugar e identificadores de mesa ---------- */
#cardsView{position:fixed;inset:0;z-index:60;background:#e7e1d8;display:none;flex-direction:column}
body.cards-open #cardsView{display:flex}
.cv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.cv-bar h2{font-family:"Cormorant Garamond",serif;font-size:22px;margin:0 8px 0 0;font-weight:600}
.cv-bar select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.cv-bar label{font-size:13px;display:flex;align-items:center;gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:7px 12px}
.seg button.on{background:var(--ink);color:#fff}
.cv-info{font-size:12px;color:var(--muted);flex-basis:100%}
.cv-scroll{flex:1;overflow:auto;padding:20px}
.sheet{width:21.59cm;height:27.94cm;background:#fff;margin:0 auto 20px;box-shadow:0 6px 24px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;overflow:hidden;
  --g:#a88042;color:#4a3d2c;font-family:"Cormorant Garamond",serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.grid{display:grid;grid-template-columns:repeat(2,auto)}
.cut{outline:.2mm dashed #d4d0c8;outline-offset:0;position:relative}
.face{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.face::before{content:"";position:absolute;inset:3mm;border:.9mm double var(--g);pointer-events:none}
.face img{display:block}
.face .who{font-family:"Pinyon Script",cursive;line-height:1.05;color:#3d3224;padding:0 6mm;max-width:100%}
.face .lbl{font-variant-numeric:lining-nums;text-transform:uppercase;letter-spacing:.35em;color:var(--g);font-weight:600}
.face .blank{display:block;width:62%;border-bottom:.3mm solid #8d7a5c;height:1.1em}
.face .rule{width:2.2cm;height:.3mm;background:var(--g);margin:1.2mm 0 1.6mm;opacity:.7}
.flip{transform:rotate(180deg)}
.fold{border-top:.25mm dashed #bdb6aa}
/* tarjeta por mesa */
.tc .face{width:18cm}
.tc .face::before{inset:5mm;border-width:1.4mm}
.tc .head{display:flex;flex-direction:column;align-items:center}
.tc .mesa{font-family:"Pinyon Script",cursive;color:#3d3224;line-height:1}
.tc .num{font-variant-numeric:lining-nums;font-weight:600;color:var(--g);line-height:.95}
.tc .names{font-size:15pt;line-height:1.5;color:#3d3224;letter-spacing:.02em}
.tc .names.many{font-size:13.5pt;line-height:1.4}
.tc .names .blank{display:inline-block;width:5cm;height:1em}
.tc .sep{background:var(--g);opacity:.6}
/* doblada: mitad de 18 x 12.4 cm, número a la izquierda y nombres a la derecha */
.tc.f .face{height:12.4cm;flex-direction:row;padding:0 12mm;gap:8mm}
.tc.f .head{width:6.2cm;flex-shrink:0}
.tc.f img{height:3.1cm;margin-bottom:1mm}.tc.f .mesa{font-size:32pt}.tc.f .num{font-size:80pt}.tc.f .num.long{font-size:40pt}
.tc.f .sep{width:.3mm;align-self:stretch;margin:16mm 0}
.tc.f .names{flex:1;text-align:center}
/* plana: 18 x 23 cm */
.tc.p .face{height:23cm}
.tc.p img{height:4.6cm;margin-bottom:2mm}.tc.p .mesa{font-size:46pt}.tc.p .num{font-size:120pt}.tc.p .num.long{font-size:64pt}
.tc.p .sep{width:3cm;height:.3mm;margin:6mm 0}
.tc.p .names{font-size:17pt}.tc.p .names.many{font-size:15pt}


/* ---------- Pestañas y lista A–Z ---------- */
.tabs{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
.tabs button{border:none;border-radius:0;padding:7px 14px}
.tabs button.on{background:var(--ink);color:#fff}
#alphaView{display:none;flex:1;min-height:0;flex-direction:column;background:var(--bg)}
body.view-lista main{display:none}
body.view-lista #alphaView{display:flex}
body.view-lista #bGuests{visibility:hidden}
.av-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.av-bar input,.av-bar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.av-bar input{flex:1;min-width:180px;max-width:360px}
.av-count{font-size:13px;color:var(--muted)}
#avList{flex:1;overflow:auto;padding:8px 20px 40px}
.av-ptitle{display:none}
.av-letter{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:700;color:var(--gold);margin:16px 0 4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.av-row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) 90px 150px;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border-left:4px solid var(--c)}
.av-row:nth-child(even){background:#fffdf9}
.av-row:hover{background:var(--cs)}
.av-row .n{font-weight:600}
.av-row .n small{font-weight:400;color:var(--muted);margin-left:6px}
.av-row .fam{border:none;margin:0;font-size:13px;color:var(--muted);background:none}
.av-row .mesa{font-weight:600;text-align:right}
.av-row .mesa.none{color:#b5533c;font-weight:500}
@media (max-width:700px){ .av-row{grid-template-columns:1fr auto} .av-row .fam,.av-row .tg{display:none} #avList,.av-bar{padding-left:12px;padding-right:12px} }

@page{size:letter;margin:0}
@media print{
  body.cards-open > *:not(#cardsView){display:none!important}
  body.cards-open #cardsView{position:static;display:block;background:none}
  body.cards-open .cv-bar{display:none}
  body.cards-open .cv-scroll{overflow:visible;padding:0}
  body.cards-open .sheet{zoom:1!important;margin:0;box-shadow:none;break-after:page}
  body.cards-open .cut{outline-color:#e2ded6}
  #cardsView{display:none}
  body.view-lista #alphaView{display:block!important}
  body.view-lista #printArea,body.view-lista .av-bar{display:none!important}
  body.view-lista #alphaView{padding:0}
  body.view-lista #avList{overflow:visible;padding:0}
  body.view-lista .av-page{box-sizing:border-box;height:27.9cm;padding:12mm 13mm;break-after:page;overflow:hidden}
  body.view-lista .av-page:last-child{break-after:auto}
  body.view-lista .av-ptitle{display:block;font-family:"Cormorant Garamond",serif;font-size:24pt;text-align:center;margin:0 0 6mm;color:#3d3224}
  body.view-lista .av-ptitle small{font-size:13pt;color:#8a7f74}
  body.view-lista .av-cols{column-count:2;column-gap:12mm;column-fill:balance;font-size:11pt}
  body.view-lista .av-letter{position:static;break-after:avoid;font-size:17pt;margin:5px 0 2px}
  body.view-lista .av-row{grid-template-columns:1fr auto;padding:2px 4px;break-inside:avoid;border-left-width:2px}
  body.view-lista .av-row .fam,body.view-lista .av-row .tg{display:none}
  body.view-lista #alphaView,body.view-lista .av-letter{background:#fff}
  body.view-lista .av-row{background:none!important}

  #printArea{padding:12mm}
  header,main,dialog,#toast{display:none!important}
  body{background:#fff}
  #printArea{display:block;font-family:Inter,sans-serif;color:#000}
  #printArea h1{font-family:"Cormorant Garamond",serif;text-align:center;margin:0 0 14px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pt{border:1px solid #bbb;border-radius:8px;padding:8px 12px;break-inside:avoid}
  .pt h3{margin:0 0 6px;font-family:"Cormorant Garamond",serif;font-size:20px}
  .pt ol{margin:0;padding-left:20px;font-size:12px}
}
</style>

<body>
<header>
  <button id="bGuests">☰ Invitados</button>
  <h1>Acomodo de Mesas <span>♥</span></h1>
  <div class="tabs" id="tabs"><button data-view="plano" class="on">Plano</button><button data-view="lista">Lista A–Z</button></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <button id="bMove" title="Arrastra las mesas para acomodarlas en el salón">Mover mesas</button>
    <button id="bPosReset" hidden>Posiciones originales</button>
    <button id="bAddTable" hidden>+ Mesa</button>
    <button id="bCenter" hidden title="Pone la pista a la mitad de las mesas">Centrar pista</button>
    <button id="bAdd">+ Invitado</button>
    <button id="bCards" class="primary">Tarjetas de mesa</button>
  </div>
  <div class="more">
    <button id="bMore" aria-haspopup="true">Más ▾</button>
    <div class="menu" id="moreMenu" hidden>
      <button id="bSave" title="Descarga un archivo de respaldo con todo el acomodo">💾 Guardar respaldo</button>
      <button id="bLoad">📂 Abrir respaldo</button>
      <hr>
      <button id="bXlsx" title="Vuelve a cargar la lista desde tu Excel (conserva el acomodo)">📥 Cargar Excel</button>
      <button id="bCsv">📤 Exportar a Excel</button>
      <button id="bPrint">🖨 Imprimir lista por mesa</button>
      <hr>
      <button id="bReset" class="danger">🗑 Vaciar mesas</button>
    </div>
  </div>
  <input type="file" id="fXlsx" accept=".xlsx,.xls" hidden>
  <input type="file" id="fJson" accept=".json" hidden>
</header>
<main>
  <div id="scrim"></div>
  <aside id="side">
    <div class="filters">
      <div style="display:flex;gap:8px;align-items:center"><div class="tabs" id="listTabs"><button data-mode="fam" class="on">Por familia</button><button data-mode="az">A–Z</button></div>
        <button id="bPrintAZ" title="Imprime la lista de invitados en orden alfabético con su mesa" style="margin-left:auto">🖨 Imprimir A–Z</button></div>
      <input type="search" id="q" placeholder="Buscar invitado…">
      <div class="chips" id="sideChips"></div>
      <div class="hint">Arrastra una persona a una silla, o arrastra el nombre de la familia a una mesa para sentarlos juntos. También puedes tocar un nombre y luego tocar la silla. Arrastra de una silla aquí para quitarlo.</div>
    </div>
    <div id="guestList"></div>
  </aside>
  <div id="trash" title="Suelta aquí una mesa para eliminarla, o un invitado para quitarlo de su silla">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
    <span id="trashTxt">Suelta aquí para eliminar</span>
  </div>
  <div id="planWrap">
    <div class="zoombar"><button data-zoom="-1">−</button><button data-zoom="0">Ajustar</button><button data-zoom="1">+</button></div>
    <div id="stageBox"><div id="stage"></div></div>
  </div>
</main>
<section id="alphaView">
  <div class="av-bar">
    <input type="search" id="avQ" placeholder="Buscar invitado…">
    <select id="avF"><option value="all">Todos</option><option value="con">Con mesa</option><option value="sin">Sin mesa</option></select>
    <select id="avS"><option value="Todos">Novia y Novio</option><option value="Novia">Solo Novia</option><option value="Novio">Solo Novio</option></select>
    <span class="av-count" id="avCount"></span>
    <span style="margin-left:auto"></span>
    <button id="avPrint">Imprimir lista A–Z</button>
  </div>
  <div id="avList"></div>
</section>

<dialog id="dTable">
  <div class="dlg-h" id="dtTitle"></div>
  <div class="dlg-b">
    <label>Nombre de la mesa</label>
    <input id="dtName">
    <label>Sillas</label>
    <div style="display:flex;align-items:center;gap:10px"><button id="dtMinus">−</button><b id="dtCount"></b><button id="dtPlus">+</button></div>
    <div id="dtSeats" style="margin-top:10px"></div>
  </div>
  <div class="dlg-f">
    <button id="dtClear" class="danger">Vaciar mesa</button>
    <button id="dtClose" class="primary">Listo</button>
  </div>
</dialog>

<dialog id="dFam">
  <div class="dlg-h" id="dfTitle">Invitado</div>
  <div class="dlg-b">
    <label>Nombre (como viene en la invitación)</label>
    <input id="dfName">
    <div class="row2">
      <div><label>Parentesco</label>
        <select id="dfSide"><option>Novia</option><option>Novio</option><option>Novios</option><option>Otro</option></select></div>
      <div class="row2">
        <div><label>Adultos</label><input id="dfAd" type="number" min="0" max="20"></div>
        <div><label>Niños</label><input id="dfKid" type="number" min="0" max="20"></div>
      </div>
    </div>
    <label>Nombre de cada persona (opcional)</label>
    <div id="dfNames"></div>
  </div>
  <div class="dlg-f">
    <button id="dfDel" class="danger" style="margin-right:auto">Eliminar</button>
    <button id="dfCancel">Cancelar</button>
    <button id="dfOk" class="primary">Guardar</button>
  </div>
</dialog>

<div id="selbar"><span>Seleccionado: <b id="selName"></b></span><button id="selFree" hidden>Quitar de la silla</button><button id="selCancel">Cancelar</button></div>
<div id="cardsView">
  <div class="cv-bar">
    <h2>Tarjetas de mesa W&amp;M</h2>
    <select id="cvStyle"><option value="f">Doblada (se para sola)</option><option value="p">Plana (para atril o marco)</option></select>
    <select id="cvComp" title="Acompañantes y niños a los que no les has puesto nombre">
      <option value="line">Sin nombre: línea para escribir</option>
      <option value="text">Sin nombre: “Acompañante de …”</option>
      <option value="skip">Sin nombre: no ponerlo</option>
    </select>
    <span style="margin-left:auto"></span>
    <button id="cvPrint" class="primary">Imprimir</button>
    <button id="cvClose">Cerrar</button>
    <div class="cv-info" id="cvInfo"></div>
  </div>
  <div class="cv-scroll" id="cvScroll"></div>
</div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
// ---------- Datos iniciales (de "Copia de Boda.xlsx") ----------
// (la fila "Bibis y Maly" son los novios: ya están como Mary y Will en la mesa de honor)
const EXCEL_GUESTS = [["Jorge Hinojosa Flores",2,0,"Novia"],["Wilfrido Becerril Mercado",2,0,"Novio"],["Jorge Hinojosa Solís",2,0,"Novia"],["Karen Becerril Arroyo",2,1,"Novio"],["Alejandra Becerril Arroyo",1,0,"Novio"],["Edgar Bautista",3,0,"Novio"],["Pablo Conde Bárcenas",2,0,"Novia"],["Fernanda López Niño",4,0,"Novia"],["Guillermo Hernández",3,0,"Novio"],["Johana Hernandez",1,1,"Novio"],["Edgar Rocha",2,0,"Novio"],["Hilda Hernández",1,0,"Novio"],["María del Carmen Vivar",1,0,"Novia"],["Señora Concha",1,0,"Novia"],["Eduardo Rocha",2,0,"Novio"],["Ángel Hernández",2,1,"Novio"],["Maira Maya",3,1,"Novia"],["Diego Durán",2,0,"Novio"],["Jaime Pacheco",2,0,"Novia"],["Ismael Mondragón",2,0,"Novio"],["Pedro Moreno",2,1,"Novio"],["Patricia Hinojosa",2,0,"Novia"],["Erick Reyna de León",2,0,"Novio"],["Madison Pineda Pérez",3,0,"Novia"],["Mario Ramírez",2,1,"Novia"],["Fernando Ramírez",2,2,"Novia"],["Rodrigo Ramírez",2,0,"Novia"],["Carlos taxi",2,0,"Novio"],["Nidia Vivar",4,0,"Novia"],["Norma Vivar",2,0,"Novia"],["Delia",2,0,"Novio"]];

const STORE = 'boda-mesas-pachuca-v1';
const SIDES = ['Novia','Novio','Novios','Otro'];
// Plano del Salón Celebrarte (14.52 x 12.10 m) girado como "Mesas .pdf": entrada por el vestíbulo abajo,
// terraza arriba, barra/cocina a la derecha y baños arriba a la derecha. Coordenadas en metros.
const S = 88, MINX = -0.6, MINY = -2.0, MAXX = 14.75, MAXY = 17.4;
const W = Math.round((MAXX-MINX)*S), H = Math.round((MAXY-MINY)*S);
const px = x => (x-MINX)*S, py = y => (y-MINY)*S;
// Centro de cada mesa (m): 3 arriba, 2 a cada lado de la pista, 3 junto a la entrada
// 7 mesas alrededor de la pista: 1-2-3 arriba (11 sillas), 4 y 5 a los lados, 6 y 7 junto a la entrada.
// La mesa de honor (Mary y Will) va entre la 4 y la 6; el grupo musical entre la 5 y la 7
const LAYOUT = {T1:[2.1,1.75],T2:[6.05,1.75],T3:[10,1.75],T4:[2.1,5.4],T5:[10,5.4],T6:[2.1,12.2],T7:[10,12.2],
  H:[2.5,8.8],ESC:[10,8.8],PISTA:[6.05,6.98]};
// Centro de la pista: a la mitad del espacio que ocupan las mesas
function centroMesas(){
  const ps = state.tables.filter(t=>!t.honor).map(t=>state.pos[t.id] || LAYOUT[t.id]).filter(Boolean);
  if(!ps.length) return [...LAYOUT.PISTA];
  const xs = ps.map(p=>p[0]), ys = ps.map(p=>p[1]), r = v => Math.round(v*20)/20;
  return [r((Math.min(...xs)+Math.max(...xs))/2), r((Math.min(...ys)+Math.max(...ys))/2)];
}

const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase();
const keyOf = s => norm(s).replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'');
const sideOf = s => { const n = norm(s); return n==='NOVIA'?'Novia':n==='NOVIO'?'Novio':n==='NOVIOS'?'Novios':'Otro'; };
const famFromRow = ([name,ad,kid,side]) => ({key:keyOf(name),name:String(name).trim(),side:sideOf(side),adults:+ad||0,kids:+kid||0,names:[]});

function initialState(){
  const families = [{key:'NOVIOS-MARY-WILL',name:'Mary y Will',side:'Novios',adults:2,kids:0,names:['Mary','Will'],fixed:true}]
    .concat(EXCEL_GUESTS.map(famFromRow));
  const tables = [{id:'H',name:'Mesa de honor',chairs:2,honor:true}]
    .concat([1,2,3,4,5,6,7].map(n=>({id:'T'+n,name:'Mesa '+n,chairs:n<=3?11:10})));
  return {v:7, families, tables, seats:{'H-1':'NOVIOS-MARY-WILL:0','H-2':'NOVIOS-MARY-WILL:1'}, pos:defaultPos()};
}
const defaultPos = () => JSON.parse(JSON.stringify(LAYOUT));

let state;
try { state = JSON.parse(localStorage.getItem(STORE)) } catch(e) {}
if(!state || !state.families) state = initialState();
function migrate(){
  if((state.v||0) < 2){
    // v2: "Bibis y Maly" = Mary y Will; mesa de honor de 2 sillas entre la mesa 6 y la 8
    state.families = state.families.filter(f=>f.key!=='BIBIS-Y-MALY');
    const valid = new Set(people().map(p=>p.id));
    for(const s in state.seats) if(!valid.has(state.seats[s]) || s.startsWith('H-')) delete state.seats[s];
    tableById('H').chairs = 2;
    state.seats['H-1'] = 'NOVIOS-MARY-WILL:0'; state.seats['H-2'] = 'NOVIOS-MARY-WILL:1';
    state.pos = defaultPos(); state.v = 4;
  }
  if(state.v === 2 || state.v === 3){ // v3/v4: grupo musical entre la 7 y la 10; ambos a lo largo
    state.pos.ESC = [...LAYOUT.ESC]; state.pos.H = [...LAYOUT.H]; state.v = 4; }
  if(state.v === 4){ // v5: mesas 1, 2 y 3 de 11 sillas
    ['T1','T2','T3'].forEach(id=>{ const t = tableById(id); if(t && t.chairs===10) t.chairs = 11; });
    state.v = 5;
  }
  if(state.v === 5){ // v6: solo 7 mesas (se quitan la 8, 9 y 10; sus invitados quedan sin mesa)
    const fuera = ['T8','T9','T10'];
    for(const sd in state.seats) if(fuera.includes(seatTable(sd))) delete state.seats[sd];
    state.tables = state.tables.filter(t=>!fuera.includes(t.id));
    fuera.forEach(id=>delete state.pos[id]);
    Object.assign(state.pos, defaultPos());
    state.v = 6;
  }
  if(state.v === 6){ state.pos.PISTA = centroMesas(); state.v = 7; } // v7: pista movible y centrada
}
let moving = false, zoomMul = 1;
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)) } catch(e) {} }

let filter = {q:'', side:'Todos', pending:false};
let sel = null; // {type:'person'|'family', id}

// ---------- Personas ----------
function people(){
  const out = [];
  for(const f of state.families){
    const n = f.adults + f.kids;
    for(let i=0;i<n;i++) out.push(person(f,i));
  }
  return out;
}
function person(f,i){
  const kid = i >= f.adults;
  const custom = (f.names[i]||'').trim();
  let name, short;
  if(custom){ name = custom; short = shortName(custom); }
  else if(i===0){ name = f.name; short = shortName(f.name); }
  else if(!kid){ name = `Acompañante ${f.adults>2?i+' ':''}de ${f.name}`; short = '+1 '+firstWord(f.name); }
  else { const k=i-f.adults+1; name = `Niño(a) ${f.kids>1?k+' ':''}de ${f.name}`; short = 'Niño '+firstWord(f.name); }
  return {id:f.key+':'+i, fam:f, idx:i, kid, name, short};
}
const firstWord = s => s.trim().split(/\s+/)[0];
function shortName(s){ const w = s.trim().split(/\s+/); return w.length>1 && w[1].length>1 && !/^(y|de|del)$/i.test(w[1]) ? w[0]+' '+w[1][0]+'.' : w.slice(0,3).join(' '); }
const pIndex = () => Object.fromEntries(people().map(p=>[p.id,p]));
const seatOf = pid => Object.keys(state.seats).find(s=>state.seats[s]===pid);
const tableById = id => state.tables.find(t=>t.id===id);
const seatTable = sid => sid.split('-')[0];

// ---------- Asignación ----------
function assign(pid, seatId){
  const occ = state.seats[seatId];
  if(occ === pid) return;
  const prev = seatOf(pid);
  if(prev) delete state.seats[prev];
  if(occ && prev) state.seats[prev] = occ; // intercambio
  state.seats[seatId] = pid;
}
function freeSeats(t){ const r=[]; for(let i=1;i<=t.chairs;i++){ if(!state.seats[t.id+'-'+i]) r.push(t.id+'-'+i); } return r; }
function assignToTable(pid, tid){
  const t = tableById(tid); const cur = seatOf(pid);
  if(cur && seatTable(cur)===tid) return true;
  const f = freeSeats(t);
  if(!f.length){ toast(`${t.name} ya está llena`); return false; }
  assign(pid, f[0]); return true;
}
function assignFamily(key, tid, startSeat){
  const f = state.families.find(x=>x.key===key); const t = tableById(tid);
  const pend = people().filter(p=>p.fam===f && !(seatOf(p.id)||'').startsWith(tid+'-'));
  let free = freeSeats(t);
  if(startSeat){ const i = free.indexOf(startSeat); if(i>0) free = free.slice(i).concat(free.slice(0,i)); }
  let n=0;
  for(const p of pend){ if(!free.length) break; assign(p.id, free.shift()); n++; }
  if(n < pend.length) toast(`Solo cupieron ${n} de ${pend.length} en ${t.name}`);
  else toast(`${f.name}: ${n} ${n===1?'persona':'personas'} en ${t.name}`);
}
function unassign(pid){ const s = seatOf(pid); if(s) delete state.seats[s]; }
function commit(){ save(); render(); }

// ---------- Plano ----------
const stage = document.getElementById('stage');
// Sillas por lado [arriba, derecha, abajo, izquierda] según el número de sillas de la mesa
const SIDES_BY_N = {8:[3,1,3,1], 9:[3,2,3,1], 10:[3,2,3,2], 11:[4,2,3,2], 12:[4,2,4,2]};
function chairGeom(t, cx, cy){
  // Sentido horario: arriba izq→der, derecha arriba→abajo, abajo der→izq, izquierda abajo→arriba
  const [top,right,bottom,left] = SIDES_BY_N[t.chairs] || SIDES_BY_N[10], g=[];
  const row = k => { const cw = k>3 ? 52 : 56, step = cw+3; return Array.from({length:k},(_,i)=>[(i-(k-1)/2)*step, cw]); };
  const col = k => k===1 ? [0] : [-17,17];
  row(top).forEach(([dx,cw])=>g.push([cx+dx-cw/2, cy-55-8-26, cw]));
  col(right).forEach(dy=>g.push([cx+75+8, cy+dy-13, 60]));
  row(bottom).reverse().forEach(([dx,cw])=>g.push([cx+dx-cw/2, cy+55+8, cw]));
  col(left).reverse().forEach(dy=>g.push([cx-75-8-60, cy+dy-13, 60]));
  return g;
}
function render(){
  const P = pIndex();
  const box = (x1,y1,x2,y2,cls,label='',extra='') =>
    `<div class="zone ${cls}" ${extra} style="left:${px(x1)}px;top:${py(y1)}px;width:${(x2-x1)*S}px;height:${(y2-y1)*S}px">${label}</div>`;
  let h = '';
  // Alrededores (medidas tomadas de "PLANO CELEBRARTE.pdf")
  h += box(MINX,MINY,9.2,0,'terraza','Terraza');
  h += box(9.2,-1.8,12.1,0,'asador','Asador');
  h += box(12.6,MINY,13.2,2.6,'room vert','Pasillo');
  h += box(13.2,0.3,14.6,2.6,'room banos','Baños<br>hombres');
  h += box(13.2,MINY,14.6,0.3,'room banos','Baños<br>mujeres');
  h += box(13.2,2.6,14.6,4.2,'room','Alacena');
  h += box(12.6,4.2,14.6,10.6,'room','Cocina');
  h += box(12.6,12.1,13.7,13.1,'room','Cabina');
  h += box(2.9,14.52,5.5,16.6,'vestibulo','Vestíbulo<br>de acceso');
  h += box(0,0,12.1,14.52,'salon');
  h += box(12.1,2.0,12.6,10.9,'barra vert','Barra');
  h += box(3.6,14.42,4.8,14.62,'puerta');        // paso salón ↔ vestíbulo
  h += box(12,0.15,12.2,1.9,'puerta');           // paso a baños
  h += box(2.9,16.6,5.5,17.3,'entrada','Entrada');
  h += `<div class="metro" style="left:${px(5.2)}px;top:${py(-0.32)}px">14.52 m</div>`;
  h += `<div class="metro" style="left:${px(12.25)}px;top:${py(11.3)}px">12.10 m</div>`;
  const [qx,qy] = state.pos.PISTA || LAYOUT.PISTA;
  h += box(qx-1.15,qy-2.575,qx+1.15,qy+2.575,'pista',`<img src="${LOGO}" alt="W&M"><span>Pista de baile</span>`,'data-move="PISTA"');
  const [ex,ey] = state.pos.ESC;
  h += box(ex-0.55,ey-0.85,ex+0.55,ey+0.85,'escenario vert','Grupo musical','data-move="ESC"');
  h += `<div class="legend">${SIDES.map(s=>`<span class="c-${s}"><i></i>${s}</span>`).join('')}</div>`;

  for(const t of state.tables){
    let seatsG, top;
    const [mx,my] = state.pos[t.id] || LAYOUT[t.id], cx = px(mx), cy = py(my);
    if(t.honor){
      // A lo largo: mesa vertical, sillas del lado izquierdo mirando hacia la pista
      const cw=62, step=34, th=Math.max(t.chairs*step+16, 150), y0=cy-th/2, cx0=cx-32-6-cw;
      top = {x:cx-32, y:y0, w:64, h:th};
      seatsG = Array.from({length:t.chairs},(_,i)=>[cx0, y0+(th-t.chairs*step)/2+i*step+4, cw]);
      h += `<div class="honor-ctrl" style="left:${cx0-34}px;top:${cy-26}px"><button data-honor="-1">−</button><button data-honor="1">+</button></div>`;
    } else {
      top = {x:cx-75, y:cy-55, w:150, h:110};
      seatsG = chairGeom(t,cx,cy);
    }
    const occ = seatsG.map((_,i)=>state.seats[t.id+'-'+(i+1)]).filter(Boolean);
    const bar = seatsG.map((_,i)=>{ const p=P[state.seats[t.id+'-'+(i+1)]]; return `<i class="${p?p.fam.side:''}"></i>`; }).join('');
    h += `<div class="ttop ${t.honor?'honor':''} ${occ.length===t.chairs?'full':''}" data-table="${t.id}" data-move="${t.id}" style="left:${top.x}px;top:${top.y}px;width:${top.w}px;height:${top.h}px">
      <div class="tn">${esc(t.name)}</div>${t.honor?'':`<div class="tc">${occ.length} / ${t.chairs}</div><div class="bar">${bar}</div>`}</div>`;
    seatsG.forEach(([x,y,w],i)=>{
      const sid = t.id+'-'+(i+1), p = P[state.seats[sid]];
      const cls = p ? `chair occ c-${p.fam.side}` : 'chair';
      const isSel = p && sel && sel.type==='person' && sel.id===p.id;
      const hl = p && filter.q && norm(p.name).includes(norm(filter.q));
      h += `<div class="${cls}${isSel?' sel':''}${hl?' hl':''}" data-seat="${sid}" ${p?`draggable="${!moving}" data-person="${p.id}" title="${esc(p.name)} · ${esc(p.fam.side)}"`:`title="Silla ${i+1}"`} style="left:${x}px;top:${y}px;width:${w}px">
        ${p?`<span>${esc(p.short)}</span><b class="x" data-x="${sid}">×</b>`:`<span class="num">${i+1}</span>`}</div>`;
    });
  }
  stage.innerHTML = h;
  renderList(P);
  renderStats(P);
  renderSel(P);
  if(view==='lista') renderAlpha(P);
}

// ---------- Pestaña: lista de invitados A–Z ----------
let view = 'plano';
const av = {q:'', f:'all', s:'Todos'};
// Los acompañantes sin nombre se ordenan junto a su titular
const sortKey = p => norm(p.idx===0 || (p.fam.names[p.idx]||'').trim() ? p.name : p.fam.name+' ~'+p.idx);
function renderAlpha(P){
  P = P || pIndex();
  const q = norm(av.q);
  const rows = Object.values(P)
    .filter(p => !q || norm(p.name).includes(q) || norm(p.fam.name).includes(q))
    .filter(p => av.f==='all' || (av.f==='con') === !!seatOf(p.id))
    .filter(p => av.s==='Todos' || p.fam.side===av.s)
    .sort((a,b) => sortKey(a).localeCompare(sortKey(b), 'es'));
  // Agrupar por letra y repartir en 2 hojas para imprimir (la mitad de renglones en cada una)
  const groups = [];
  for(const p of rows){
    const L = sortKey(p)[0] || '#';
    if(!groups.length || groups[groups.length-1].L !== L) groups.push({L, rows:[]});
    groups[groups.length-1].rows.push(p);
  }
  const pages = [[]], half = rows.length / 2;
  let n = 0;
  for(const g of groups){
    if(rows.length >= 24 && pages.length===1 && n > 0 && n + g.rows.length/2 > half) pages.push([]);
    pages[pages.length-1].push(g); n += g.rows.length;
  }
  const h = pages.map((pg,i) => `<div class="av-page"><h2 class="av-ptitle">Encuentra tu mesa${i?' <small>(continuación)</small>':''}</h2><div class="av-cols">` +
    pg.map(g => `<div class="av-letter">${esc(g.L)}</div>` + g.rows.map(alphaRow).join('')).join('') + `</div></div>`).join('');
  $('avList').innerHTML = rows.length ? h : '<p class="hint" style="padding:20px">Sin resultados.</p>';
  const all = Object.values(P), con = all.filter(p=>seatOf(p.id)).length;
  $('avCount').textContent = `${rows.length} de ${all.length} · ${con} con mesa · ${all.length-con} sin mesa`;
}
function alphaRow(p){
    const sid = seatOf(p.id), t = sid && tableById(seatTable(sid));
    return `<div class="av-row c-${p.fam.side}" data-go="${p.id}">
      <span class="n">${esc(p.name)}${p.kid?' <small>niño</small>':''}</span>
      <span class="fam">${p.idx===0 ? '' : 'Invitación: '+esc(p.fam.name)}</span>
      <span class="tg"><span class="tag">${p.fam.side}</span></span>
      <span class="mesa ${t?'':'none'}">${t ? esc(t.honor?'Mesa de honor':t.name)+' · silla '+sid.split('-')[1] : 'Sin mesa'}</span></div>`;
}

function fit(){
  const wrap = document.getElementById('planWrap'), box = document.getElementById('stageBox');
  const avail = wrap.clientWidth - 20;
  // En pantallas angostas (tablet) se ajusta al ancho del salón; la cocina y baños quedan al deslizar
  const target = isDrawer() && avail < W ? px(12.5) : W;
  const s = Math.min(1, Math.max(.3, avail / target)) * zoomMul;
  stage.style.width = W+'px'; stage.style.height = H+'px';
  stage.style.transform = `scale(${s})`;
  box.style.width = W*s+'px'; box.style.height = H*s+'px';
  stage.dataset.scale = s;
  if(!fit.done && avail < W){ wrap.scrollTop = py(-0.3)*s; fit.done = true; } // empezar viendo el salón
}
new ResizeObserver(fit).observe(document.getElementById('planWrap'));
document.querySelector('.zoombar').onclick = e => {
  const b = e.target.closest('[data-zoom]'); if(!b) return;
  const d = +b.dataset.zoom;
  zoomMul = d===0 ? 1 : Math.min(3, Math.max(.5, zoomMul * (d>0 ? 1.25 : 0.8)));

};

// ---------- Bote de basura ----------
const trash = document.getElementById('trash');
const overTrash = (x,y) => { const r = trash.getBoundingClientRect(); return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; };
function deleteTable(id){
  const t = tableById(id);
  if(!t || t.honor){ toast('La mesa de honor no se puede eliminar'); return false; }
  const ocup = Object.keys(state.seats).filter(sd=>seatTable(sd)===id);
  if(!confirm(`¿Eliminar ${t.name}?` + (ocup.length ? ` Sus ${ocup.length} invitados quedarán sin mesa.` : ''))) return false;
  ocup.forEach(sd=>delete state.seats[sd]);
  state.tables = state.tables.filter(x=>x!==t); delete state.pos[id];
  toast(`${t.name} eliminada`); return true;
}
let mv = null;
stage.addEventListener('pointerdown', e => {
  if(!moving) return;
  const el = e.target.closest('[data-move]'); if(!el) return;
  e.preventDefault();
  const id = el.dataset.move;
  mv = {id, sx:e.clientX, sy:e.clientY, o:[...(state.pos[id] || LAYOUT[id])]};
});
window.addEventListener('pointermove', e => {
  if(!mv) return;
  const k = (+stage.dataset.scale || 1) * S, snap = v => Math.round(v*20)/20;
  state.pos[mv.id] = [snap(mv.o[0] + (e.clientX-mv.sx)/k), snap(mv.o[1] + (e.clientY-mv.sy)/k)];
  trash.classList.toggle('over', overTrash(e.clientX, e.clientY));
  render();
});
window.addEventListener('pointerup', e => {
  if(!mv) return;
  const m = mv; mv = null; trash.classList.remove('over');
  if(overTrash(e.clientX, e.clientY)){
    state.pos[m.id] = m.o; // si cancela, regresa a donde estaba
    if(m.id==='ESC') toast('El grupo musical no se puede eliminar');
    else if(m.id==='PISTA') toast('La pista no se puede eliminar');
    else deleteTable(m.id);
  }
  commit();
});

function renderListAZ(P, tname){

  }

function renderList(P){
  const all = Object.values(P);
  const tname = sid => { const t = tableById(seatTable(sid)); return t.honor ? 'Honor' : t.name.replace(/^Mesa\s*/i,'M'); };
  document.querySelectorAll('#listTabs button').forEach(b=>b.classList.toggle('on', b.dataset.mode===listMode));
  if(listMode==='az') return renderListAZ(P, tname);
  let h = '';
  for(const f of state.families){
    if(filter.side!=='Todos' && f.side!==filter.side) continue;
    const ps = all.filter(p=>p.fam===f);
    const q = norm(filter.q);
    if(q && !norm(f.name).includes(q) && !ps.some(p=>norm(p.name).includes(q))) continue;
    const seated = ps.filter(p=>seatOf(p.id));
    if(filter.pending && seated.length===ps.length) continue;
    h += `<div class="fam c-${f.side} ${seated.length===ps.length&&ps.length?'done':''} ${sel&&sel.type==='family'&&sel.id===f.key?'sel':''}" >
      <div class="fam-h" draggable="true" data-family="${f.key}" title="Arrastra a una mesa para sentar a toda la familia">
        <span class="nm">${esc(f.name)}</span><span class="tag">${f.side}</span>
        <span class="count">${seated.length}/${ps.length}</span>
        <button class="icon" data-edit="${f.key}" title="Editar nombres">✎</button>
      </div><div class="persons">`;
    for(const p of ps){
      const s = seatOf(p.id);
      h += `<div class="p ${p.kid?'kid':''} ${s?'seated':''} ${sel&&sel.type==='person'&&sel.id===p.id?'sel':''}" draggable="true" data-person="${p.id}" title="${esc(p.name)}${s?' — '+tableById(seatTable(s)).name+', silla '+s.split('-')[1]:''}">

    }
    h += `</div></div>`;
  }
  list.innerHTML = h || '<p class="hint" style="padding:10px">Sin resultados.</p>';
}
function renderStats(P){

// ---------- Tocar / clic (también funciona en celular) ----------
list.addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if(ed){ openFam(ed.dataset.edit); return; }
  const pe = e.target.closest('[data-person]'), fh = e.target.closest('[data-family]');
  if(pe) sel = sel && sel.id===pe.dataset.person ? null : {type:'person', id:pe.dataset.person};
  else if(fh) sel = sel && sel.id===fh.dataset.family ? null : {type:'family', id:fh.dataset.family};
  else return;
  if(sel) toast(sel.type==='person' ? 'Ahora toca la silla o la mesa' : 'Ahora toca la mesa para sentar a la familia');
  if(sel && isDrawer()) drawer(false);
  render();
});
list.addEventListener('dblclick', e => { const pe = e.target.closest('[data-person]'); if(pe) openFam(pe.dataset.person.split(':')[0]); });
stage.addEventListener('click', e => {
  if(moving) return;
  const hb = e.target.closest('[data-honor]');
  if(hb){ const t = tableById('H'); setChairs(t, t.chairs + +hb.dataset.honor); return; }
  const x = e.target.closest('[data-x]'); if(x){ delete state.seats[x.dataset.x]; commit(); return; }
  const ch = e.target.closest('.chair'), tt = e.target.closest('.ttop');
  if(ch){
    const sid = ch.dataset.seat, occ = state.seats[sid];
    if(sel && sel.type==='person'){ assign(sel.id, sid); sel=null; commit(); }
    else if(sel && sel.type==='family'){ assignFamily(sel.id, seatTable(sid), sid); sel=null; commit(); }
    else if(occ){ sel = {type:'person', id:occ}; toast('Toca otra silla para moverlo (o intercambiar)'); render(); }
    return;
  }
  if(tt){
    const tid = tt.dataset.table;
    if(sel && sel.type==='person'){ assignToTable(sel.id, tid); sel=null; commit(); }
    else if(sel && sel.type==='family'){ assignFamily(sel.id, tid); sel=null; commit(); }
    else openTable(tid);
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && sel){ sel=null; render(); } });

// ---------- Diálogo de mesa ----------
const dT = document.getElementById('dTable'); let curT = null;
function openTable(tid){
  curT = tableById(tid);
  document.getElementById('dtName').value = curT.name;
  fillTable(); dT.showModal();
}
function setChairs(t, n){
  const [min,max] = t.honor ? [2,14] : [8,12];
  if(n<min || n>max){ toast(`Esta mesa puede tener de ${min} a ${max} sillas`); return false; }
  if(n < t.chairs && state.seats[t.id+'-'+t.chairs]){ toast('Primero libera la última silla'); return false; }
  t.chairs = n; commit(); return true;
}
document.getElementById('dtMinus').onclick = () => { setChairs(curT, curT.chairs-1); fillTable(); };
document.getElementById('dtPlus').onclick = () => { setChairs(curT, curT.chairs+1); fillTable(); };
function fillTable(){
  document.getElementById('dtCount').textContent = curT.chairs;
  const P = pIndex();
  document.getElementById('dtTitle').textContent = curT.name;
  let h=''; for(let i=1;i<=curT.chairs;i++){ const sid=curT.id+'-'+i, p=P[state.seats[sid]];
    h += `<div class="seatrow"><span class="n">${i}</span><span class="who">${p?`<span class="dot c-${p.fam.side}"></span>${esc(p.name)} <small>· ${p.fam.side}${p.kid?' · niño':''}</small>`:'<small>— libre —</small>'}</span>${p?`<button class="icon" data-free="${sid}" title="Quitar">✕</button>`:''}</div>`; }
  document.getElementById('dtSeats').innerHTML = h;
}
document.getElementById('dtSeats').onclick = e => { const b=e.target.closest('[data-free]'); if(b){ delete state.seats[b.dataset.free]; commit(); fillTable(); } };
document.getElementById('dtName').oninput = e => { curT.name = e.target.value || curT.name; document.getElementById('dtTitle').textContent = curT.name; commit(); };
document.getElementById('dtClose').onclick = () => dT.close();
document.getElementById('dtClear').onclick = () => { for(let i=1;i<=curT.chairs;i++) delete state.seats[curT.id+'-'+i]; commit(); fillTable(); };

// ---------- Diálogo de invitado ----------
const dF = document.getElementById('dFam'); let curF = null;
const $ = id => document.getElementById(id);
function openFam(key){
  curF = key ? state.families.find(f=>f.key===key) : null;
  $('dfTitle').textContent = curF ? 'Editar invitado' : 'Nuevo invitado';
  $('dfName').value = curF ? curF.name : '';
  $('dfSide').value = curF ? curF.side : 'Novia';
  $('dfAd').value = curF ? curF.adults : 1;
  $('dfKid').value = curF ? curF.kids : 0;
  $('dfDel').style.display = curF ? '' : 'none';
  namesFields(curF ? curF.names : []);
  dF.showModal();
}
function namesFields(existing){
  const a = +$('dfAd').value||0, k = +$('dfKid').value||0, cur = [...document.querySelectorAll('#dfNames input')].map(i=>i.value);
  const vals = cur.length ? cur : existing;
  let h=''; for(let i=0;i<a+k;i++){
    const ph = i===0 ? ($('dfName').value||'Titular') : i<a ? `Acompañante ${i}` : `Niño(a) ${i-a+1}`;
    h += `<input style="margin-bottom:6px" placeholder="${esc(ph)}" value="${esc(vals[i]||'')}">`; }
  $('dfNames').innerHTML = h;
}
$('dfAd').oninput = $('dfKid').oninput = () => namesFields([]);
$('dfCancel').onclick = () => dF.close();
$('dfOk').onclick = () => {
  const name = $('dfName').value.trim(); if(!name){ $('dfName').focus(); return; }
  const adults = Math.max(0,+$('dfAd').value||0), kids = Math.max(0,+$('dfKid').value||0);
  const names = [...document.querySelectorAll('#dfNames input')].map(i=>i.value.trim());
  if(curF){
    const oldN = curF.adults + curF.kids;
    for(let i=adults+kids;i<oldN;i++) unassign(curF.key+':'+i);
    Object.assign(curF,{name,side:$('dfSide').value,adults,kids,names});
  } else {
    let key = keyOf(name)||'INV'; while(state.families.some(f=>f.key===key)) key += '-2';
    state.families.push({key,name,side:$('dfSide').value,adults,kids,names,manual:true});
  }
  dF.close(); commit();
};
$('dfDel').onclick = () => {
  if(!confirm(`¿Eliminar a "${curF.name}" de la lista?`)) return;
  for(let i=0;i<curF.adults+curF.kids;i++) unassign(curF.key+':'+i);
  state.families = state.families.filter(f=>f!==curF); dF.close(); commit();
};
$('bAdd').onclick = () => openFam(null);

// ---------- Excel / respaldo / impresión ----------
$('bXlsx').onclick = () => { if(!window.XLSX){ toast('No se pudo cargar el lector de Excel (¿sin internet?)'); return; } $('fXlsx').click(); };
$('fXlsx').onchange = async e => {
  const file = e.target.files[0]; e.target.value=''; if(!file) return;
  try{
    const wb = XLSX.read(await file.arrayBuffer());
    let rows = null, ci = null;
    for(const sn of wb.SheetNames){
      const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:null});
      const hi = r.findIndex(row => row.some(c=>norm(c)==='NOMBRE'));
      if(hi<0) continue;
      const hd = r[hi].map(norm);
      ci = {n:hd.indexOf('NOMBRE'), a:hd.findIndex(c=>c.includes('ADULT')), k:hd.findIndex(c=>c.includes('NINO')), p:hd.findIndex(c=>c.includes('PARENT'))};
      rows = r.slice(hi+1); break;
    }
    if(!rows) throw new Error('No encontré la columna NOMBRE');
    const fresh = rows.filter(r=>r[ci.n] && String(r[ci.n]).trim())
      .map(r=>famFromRow([r[ci.n], ci.a>=0?r[ci.a]:1, ci.k>=0?r[ci.k]:0, ci.p>=0?r[ci.p]:'']))
      .filter(f=>f.side!=='Novios'); // los novios ya están como Mary y Will
    const old = Object.fromEntries(state.families.map(f=>[f.key,f]));
    fresh.forEach(f=>{ if(old[f.key]) f.names = old[f.key].names; });
    const keep = state.families.filter(f=>(f.fixed||f.manual) && !fresh.some(n=>n.key===f.key));
    state.families = keep.filter(f=>f.fixed).concat(fresh, keep.filter(f=>!f.fixed));
    const valid = new Set(people().map(p=>p.id));
    for(const s in state.seats) if(!valid.has(state.seats[s])) delete state.seats[s];
    commit(); toast(`Lista actualizada: ${fresh.length} invitaciones`);
  }catch(err){ toast('Error al leer el Excel: '+err.message); }
};
function download(name, content, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content],{type})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
$('bSave').onclick = () => download('acomodo-mesas-boda.json', JSON.stringify(state,null,1), 'application/json');
$('bLoad').onclick = () => $('fJson').click();
$('fJson').onchange = async e => {
  const file = e.target.files[0]; e.target.value=''; if(!file) return;
  try{ const s = JSON.parse(await file.text()); if(!s.families||!s.tables) throw 0; state = s; commit(); toast('Respaldo cargado'); }
  catch{ toast('Ese archivo no es un respaldo válido'); }
};
$('bCsv').onclick = () => {
  const P = pIndex(); const rows = [['Mesa','Silla','Nombre','Parentesco','Invitación','Tipo']];
  for(const t of state.tables) for(let i=1;i<=t.chairs;i++){ const p=P[state.seats[t.id+'-'+i]]; if(p) rows.push([t.name,i,p.name,p.fam.side,p.fam.name,p.kid?'Niño':'Adulto']); }
  Object.values(P).filter(p=>!seatOf(p.id)).forEach(p=>rows.push(['Sin mesa','',p.name,p.fam.side,p.fam.name,p.kid?'Niño':'Adulto']));
  download('acomodo-mesas-boda.csv', '﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
};
$('bPrint').onclick = () => {
  const P = pIndex();
  let h = '<h1>Acomodo de Mesas</h1><div class="pgrid">';
  for(const t of state.tables){
    h += `<div class="pt"><h3>${esc(t.name)}</h3><ol>`;
    for(let i=1;i<=t.chairs;i++){ const p=P[state.seats[t.id+'-'+i]]; h += `<li>${p?esc(p.name)+' <small>('+p.fam.side+')</small>':'—'}</li>`; }
    h += '</ol></div>';
  }
  const pend = Object.values(P).filter(p=>!seatOf(p.id));
  if(pend.length) h += `<div class="pt"><h3>Sin mesa (${pend.length})</h3><ol>${pend.map(p=>`<li>${esc(p.name)}</li>`).join('')}</ol></div>`;
  $('printArea').innerHTML = h + '</div>';
  window.print();
};
$('bReset').onclick = () => {
  if(!confirm('¿Quitar a todos los invitados de sus sillas? (la lista no se borra)')) return;
  const keep = {}; for(const s in state.seats) if(state.seats[s].startsWith('NOVIOS-MARY-WILL')) keep[s]=state.seats[s];
  state.seats = keep; commit();
};

// ---------- Tarjeta por mesa (logo, número de mesa y nombres de los invitados) ----------
const cv = {style:'f', comp:'line'};
function tableLabel(t){
  if(t.honor) return {mesa:'Mesa de', num:'Honor'};
  const m = t.name.match(/^\s*mesa\s+(.+)$/i);
  return m ? {mesa:'Mesa', num:m[1]} : {mesa:'', num:t.name};
}
function tableGuests(t){
  const P = pIndex(), out = [];
  for(let i=1;i<=t.chairs;i++){
    const p = P[state.seats[t.id+'-'+i]]; if(!p) continue;
    const named = p.idx===0 || (p.fam.names[p.idx]||'').trim();
    if(named || cv.comp==='text') out.push(p.name);
    else if(cv.comp==='line') out.push('');
  }
  return out;
}
function faceMesa(t, flip){
  const L = tableLabel(t), g = tableGuests(t), big = L.num.length>3;
  const names = g.map(n => n ? `<div>${esc(n)}</div>` : `<div><span class="blank"></span></div>`).join('');
  return `<div class="face${flip?' flip':''}">
    <div class="head"><img src="${LOGO}" alt="">${L.mesa?`<div class="mesa">${L.mesa}</div>`:''}<div class="num${big?' long':''}">${esc(L.num)}</div></div>
    <div class="sep"></div><div class="names${g.length>8?' many':''}">${names}</div></div>`;
}
function renderCards(){
  const ts = state.tables.filter(t => tableGuests(t).length);
  const pages = ts.map(t => `<div class="sheet"><div class="tc ${cv.style} cut">${cv.style==='f' ? faceMesa(t,true)+`<div class="fold">${faceMesa(t,false)}</div>` : faceMesa(t,false)}</div></div>`);
  const sinNombre = ts.reduce((a,t)=>a+tableGuests(t).filter(n=>!n).length,0);
  $('cvInfo').textContent = `${ts.length} tarjetas, una por mesa (una hoja carta cada una)` +
    (ts.length < state.tables.length ? ` · ${state.tables.length-ts.length} mesas sin invitados no se imprimen` : '') +
    (sinNombre ? ` · ${sinNombre} acompañantes con línea para escribir su nombre (ponles nombre con ✎ para que salga impreso)` : '') +
    ` · Imprime al 100% (sin "ajustar a la página")` + (cv.style==='f' ? ', corta y dobla por la mitad para que se pare sobre la mesa.' : '.');
  $('cvScroll').innerHTML = pages.join('') || '<p style="text-align:center;color:#8a7f74">Aún no hay invitados sentados.</p>';
  cardsZoom();
}
function cardsZoom(){
  const w = $('cvScroll').clientWidth - 40, z = Math.min(.75, w / (21.59*37.8));
  document.querySelectorAll('#cvScroll .sheet').forEach(s => s.style.zoom = z);
}
new ResizeObserver(cardsZoom).observe($('cvScroll'));
$('bCards').onclick = () => { document.body.classList.add('cards-open'); renderCards(); };
$('cvClose').onclick = () => document.body.classList.remove('cards-open');
$('cvStyle').onchange = e => { cv.style = e.target.value; renderCards(); };
$('cvComp').onchange = e => { cv.comp = e.target.value; renderCards(); };
$('cvPrint').onclick = async () => { try { await document.fonts.ready } catch(e) {} window.print(); };

let tt; function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }

migrate(); save(); renderChips(); render(); fit();
</script>
